name: Deploy to GitHub Pages

# Builds the static game and publishes dist/ to Pages. Deploys a rolling PREVIEW
# on every push to the working branch so the team can test each build on mobile +
# desktop before it's merged; also deploys from main.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The configure-pages step below tries to enable this
# automatically (enablement: true); if org policy blocks that, do it manually once.
on:
  push:
    branches: [main, claude/f-outta-my-way-game-gr30fx]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure Pages (best-effort auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
