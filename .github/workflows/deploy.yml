name: Deploy to GitHub Pages

# Builds the static game and publishes dist/ to the `gh-pages` branch on every
# push to the working branch (and main). Publishing to a branch (rather than the
# "GitHub Actions" Pages environment) lets us deploy a rolling PREVIEW from the
# feature branch before merge — the github-pages environment blocks non-default
# branches.
#
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "Deploy from a branch" -> Branch: "gh-pages" / "/ (root)".
# After that, every push redeploys automatically to
# https://slimsheikki.github.io/fuckouttamyway/
on:
  push:
    branches: [main, claude/f-outta-my-way-game-gr30fx]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "deploy ${GITHUB_SHA}"
          git branch -M gh-pages
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
